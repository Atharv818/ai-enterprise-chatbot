services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/code/app
      - ./storage:/code/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chatbot-net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chatbot
      POSTGRES_USER: chatbot_app
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot_app -d chatbot"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chatbot-net

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - chatbot-net    

networks:
  chatbot-net:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:

  

